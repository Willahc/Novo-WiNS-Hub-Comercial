# /etc/nginx/sites-available/winshubcomercial.com.br
#
# Requer o certificate do Let's Encrypt, por exemplo:
#   certbot certonly --webroot -w /var/www/html \
#     -d winshubcomercial.com.br -d www.winshubcomercial.com.br
#
# E o arquivo de senha:
#   printf 'wins:%s\n' "$(openssl passwd -apr1 'SUA-SENHA')" > /etc/nginx/.htpasswd-winshub
#   chmod 640 /etc/nginx/.htpasswd-winshub

server {
	listen 80;
	listen [::]:80;
	server_name winshubcomercial.com.br www.winshubcomercial.com.br;

	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}

	location / {
		return 301 https://winshubcomercial.com.br$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name www.winshubcomercial.com.br;

	ssl_certificate /etc/letsencrypt/live/winshubcomercial.com.br/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/winshubcomercial.com.br/privkey.pem;

	return 301 https://winshubcomercial.com.br$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name winshubcomercial.com.br;

	ssl_certificate /etc/letsencrypt/live/winshubcomercial.com.br/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/winshubcomercial.com.br/privkey.pem;

	# O painel nao tem login proprio: sem auth_basic ele fica aberto ao publico.
	auth_basic "WiNS Hub Comercial";
	auth_basic_user_file /etc/nginx/.htpasswd-winshub;

	# Planilhas e importacoes pequenas; evita upload gigante.
	client_max_body_size 10m;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# Buscas longas: nao derrubar a conexao no meio.
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}
}
